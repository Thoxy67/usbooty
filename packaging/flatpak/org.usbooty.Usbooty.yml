app-id: org.usbooty.Usbooty
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: usbooty

# usbooty's whole reason to exist is writing to physical block devices,
# which a sandbox normally can't do. We open the box one targeted hole at a
# time and rely on polkit for the actual privilege escalation so the user
# still gets the password prompt before any destructive operation.
finish-args:
  # The Qt UI itself.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Talk to udisks2 / polkit / freedesktop notifier on the session bus.
  - --socket=session-bus
  # The helper runs via pkexec, which lives on the system bus.
  - --socket=system-bus
  # Raw block-device access (needed to enumerate /sys/block and read SMART).
  - --device=all
  # Read the user's ISO files via the freedesktop portal — no host=true.
  - --filesystem=xdg-download:ro
  - --filesystem=home:ro
  # Network only for the optional "Download a Windows ISO" feature.
  - --share=network
  # File-picker portal so the Browse dialog works without --filesystem=host.
  - --talk-name=org.freedesktop.portal.FileChooser
  # Spawn host-side helpers (mkfs.*, ventoy, smartctl, …). These usually
  # don't live in the Flatpak runtime, so a Flatpak install on a system
  # without them won't be able to format / install Ventoy / probe SMART.
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/usbooty/cargo
    RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

modules:
  - name: usbooty
    buildsystem: simple
    build-options:
      env:
        # Build with the sandbox's qt6 SDK; cxx-qt-build picks it up via
        # pkg-config which is already on the SDK PATH.
        QT_QPA_PLATFORM_PLUGIN_PATH: /usr/lib/qt6/plugins
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/usbooty
        ${FLATPAK_DEST}/bin/usbooty
      - install -Dm755 target/release/usbooty-helper
        ${FLATPAK_DEST}/libexec/usbooty/usbooty-helper
      - install -Dm644 data/org.usbooty.Usbooty.desktop
        ${FLATPAK_DEST}/share/applications/org.usbooty.Usbooty.desktop
      - install -Dm644 data/org.usbooty.Usbooty.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/org.usbooty.Usbooty.metainfo.xml
      - install -Dm644 data/icons/org.usbooty.Usbooty.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/org.usbooty.Usbooty.svg
      - install -Dm644 data/org.usbooty.helper.policy
        ${FLATPAK_DEST}/share/polkit-1/actions/org.usbooty.helper.policy
    sources:
      # Use `flatpak-builder --install-deps-from=flathub`. For an out-of-tree
      # build replace this with a git or archive source.
      - type: dir
        path: ../..
      # `cargo-sources.json` is generated by:
      #   flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      # so the build runs fully offline (Flatpak's sandbox blocks network
      # during the build step). Re-run after every Cargo.lock change.
      - cargo-sources.json
