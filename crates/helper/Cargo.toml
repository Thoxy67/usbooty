[package]
name = "usbooty-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Privileged helper for usbooty, performs all device mutation"

[[bin]]
name = "usbooty-helper"
path = "src/main.rs"

[dependencies]
usbooty-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
nix = { version = "0.31", features = ["fs", "ioctl", "mount", "signal", "user"] }
gptman = "3.1.1"
mbrman = "0.6.1"
blake3 = { workspace = true }
# Streaming decompression of pre-compressed images (foo.iso.{gz,xz,zst,bz2}).
flate2 = "1"
xz2 = "0.1"
# `pkg-config` feature → zstd-sys uses the system libzstd via pkg-config
# instead of bundling its own vendored static build. The vendored path
# silently drops its link directive in some chroot environments (notably
# makepkg's clean build), leaving the linker without `-lzstd` and the
# binary unresolved. Combined with ZSTD_SYS_USE_PKG_CONFIG=1 in PKGBUILD.
zstd = { version = "0.13", features = ["pkg-config"] }
bzip2 = "0.6"

# The source ISO is loop-mounted, so the kernel parses ISO9660/UDF for us;
# no userspace ISO reader is needed in the helper (the GUI still uses `cdfs`).

[dev-dependencies]
tempfile = "3"
