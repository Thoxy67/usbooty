[package]
name = "usbooty-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Privileged helper for usbooty — performs all device mutation"

[[bin]]
name = "usbooty-helper"
path = "src/main.rs"

[dependencies]
usbooty-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
nix = { version = "0.31", features = ["fs", "ioctl", "mount", "signal"] }
gptman = "3.1.1"
mbrman = "0.6.1"

# The source ISO is loop-mounted, so the kernel parses ISO9660/UDF for us —
# no userspace ISO reader is needed in the helper (the GUI still uses `cdfs`).
