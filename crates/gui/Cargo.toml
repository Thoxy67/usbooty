[package]
name = "usbooty-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Qt/QML front-end for usbooty"

[lib]
name = "usbooty_gui"
path = "src/lib.rs"

[[bin]]
name = "usbooty"
path = "src/main.rs"

[dependencies]
usbooty-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
cxx = "1"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_gui", "qt_qml"] }
cdfs = "0.2.3"
ureq = { version = "3.3.0", features = ["cookies"] }
directories = "6.0.0"
sha2 = { workspace = true }
blake3 = { workspace = true }
md-5 = "0.11"
sha1 = "0.11"
# Transparent decompression of compressed disk images. Mostly pure-Rust;
# xz / .lzma route through xz2 (system liblzma) for true streaming so a
# multi-GB compressed image doesn't have to live in RAM. liblzma is already
# pulled by the helper, so no new system link is added overall.
xz2 = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bzip2 = { version = "0.6", features = ["static"] }
zstd = "0.13"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Pure-Rust LZW reader used for `.Z` (Unix compress(1)). The Decoder reads
# the standard 3-byte header (magic + flag byte with the max-code-width)
# and dispenses the underlying LZW stream, exactly what we need to slot
# `.Z` into the decompress dispatch alongside xz / gz / bz2 / zst.
weezl = "0.2"
tempfile = "3"

[build-dependencies]
# The translator C++ shim (include/translator_bridge.cpp) is added to
# cxx-qt-build's batch via .cpp_file() so it gets the same Qt include
# paths, link order and ABI flags as the rest of the generated glue.
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
