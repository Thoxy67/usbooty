[package]
name = "usbooty-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Qt/QML front-end for usbooty"

[[bin]]
name = "usbooty"
path = "src/main.rs"

[dependencies]
usbooty-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
cxx = "1"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_gui", "qt_qml"] }
cdfs = "0.2.3"
ureq = { version = "3.3.0", features = ["cookies"] }
directories = "6.0.0"
sha2 = { workspace = true }

[build-dependencies]
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
