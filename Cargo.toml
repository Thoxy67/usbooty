[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://git.thoxy.xyz/thoxy/usbooty"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# blake3: fast internal read-back verification. sha2: the GUI's displayable
# checksum, since distros/Microsoft publish SHA-256 for cross-checking.
blake3 = "1"
sha2 = "0.11.0"
usbooty-core = { path = "crates/core" }

[profile.release]
# LTO is off: cxx-qt-lib's C++ glue compiles under GCC without LTO, so
# turning Rust LTO on (even "thin") gives rust-lld undefined-symbol errors
# for the cxxbridge / qguiapplication_new entry points at final link time.
# The same reason `packaging/PKGBUILD` carries `options=('!lto')`.
lto = false
strip = true
# Single codegen unit gets back most of the binary-size win LTO would have
# given us, without breaking the C++ bridge.
codegen-units = 1
