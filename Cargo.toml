[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://git.thoxy.xyz/thoxy/usbooty"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# blake3: fast internal read-back verification. sha2: the GUI's displayable
# checksum, since distros/Microsoft publish SHA-256 for cross-checking.
blake3 = "1"
sha2 = "0.11.0"
usbooty-core = { path = "crates/core" }

[profile.release]
lto = "thin"
strip = true
