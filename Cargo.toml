[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/thoxy/usbooty"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
usbooty-core = { path = "crates/core" }

[profile.release]
lto = "thin"
strip = true
