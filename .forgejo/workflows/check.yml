name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: docker
    container:
      image: docker.io/rust:1.87-bookworm
    env:
      # zstd-sys: link system libzstd (matches the PKGBUILD's workaround).
      ZSTD_SYS_USE_PKG_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libzstd-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libgl-dev
          # crates/gui/build.rs invokes `lrelease6` (Arch name); Debian ships
          # the same binary as `lrelease` in /usr/lib/qt6/bin. Expose both.
          ln -sf /usr/lib/qt6/bin/lrelease /usr/local/bin/lrelease6
          ln -sf /usr/lib/qt6/bin/lrelease /usr/local/bin/lrelease

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Add clippy
        run: rustup component add clippy

      - name: Run check.sh
        run: ./check.sh
