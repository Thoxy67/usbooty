name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: docker
    # node:20 base so actions/checkout + actions/cache (JS actions) can run.
    # Rust is installed via rustup below so we always track current stable.
    container:
      image: docker.io/node:20-bookworm-slim
    env:
      # zstd-sys: link the system libzstd (matches the PKGBUILD's workaround).
      ZSTD_SYS_USE_PKG_CONFIG: "1"
      CARGO_TERM_COLOR: always
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install system deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential \
            pkg-config \
            libzstd-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libgl-dev
          # crates/gui/build.rs invokes `lrelease6` (Arch name); Debian ships
          # the same binary as `lrelease` in /usr/lib/qt6/bin. Expose both.
          ln -sf /usr/lib/qt6/bin/lrelease /usr/local/bin/lrelease6
          ln -sf /usr/lib/qt6/bin/lrelease /usr/local/bin/lrelease

      - name: Install latest stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain stable \
                       --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      # Forgejo docs recommend fully qualified action URLs; data.forgejo.org
      # is the runner's DEFAULT_ACTIONS_URL so being explicit avoids relying
      # on per-instance configuration.
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Cache cargo registry & target
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run check.sh
        run: ./check.sh
