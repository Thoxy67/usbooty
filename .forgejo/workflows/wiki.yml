name: publish-wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.forgejo/workflows/wiki.yml'

jobs:
  sync:
    runs-on: docker
    # node:20 base so actions/checkout (a JS action) can run; slim keeps the
    # pull small since the only extra tool we need is git itself.
    container:
      image: docker.io/node:20-bookworm-slim
    steps:
      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      # Forgejo docs recommend fully qualified action URLs over the implicit
      # `actions/checkout@v4` form, which resolves via DEFAULT_ACTIONS_URL
      # (data.forgejo.org). Being explicit makes the workflow portable across
      # instances that override that default.
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Sync docs/ to wiki
        env:
          # ${{ github.token }} is the auto-issued FORGEJO_TOKEN, scoped to
          # the running workflow. Forgejo also exposes it as
          # ${{ secrets.FORGEJO_TOKEN }} for GH-Actions compatibility; either
          # works. Wiki push permission is not formally documented; if this
          # fails with 403, replace with a user PAT stored as a real secret.
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          git config --global user.email "${ACTOR}@users.noreply.${SERVER#https://}"
          git config --global user.name  "${ACTOR}"

          # Strip scheme so we can splice in basic-auth, then re-add https://.
          host="${SERVER#https://}"
          host="${host#http://}"
          wiki_url="https://${ACTOR}:${TOKEN}@${host}/${REPO_OWNER}/${REPO_NAME}.wiki.git"

          # Surface a clear error if the wiki repo has never been initialised
          # (Forgejo only materialises .wiki.git after the first page is
          # created via the web UI). Without this, git's "Could not read from
          # remote repository" message hides the real cause.
          if ! git ls-remote "${wiki_url}" >/dev/null 2>&1; then
            echo "::error::Wiki repo not reachable. Open the repo's Wiki tab" \
                 "on ${SERVER} and create any first page, then re-run." >&2
            exit 1
          fi

          git clone "${wiki_url}" wiki

          # Wipe the existing top-level .md pages so deletions in docs/ propagate.
          # Leaves _Sidebar.md / _Footer.md / images/ alone if you add them later.
          find wiki -maxdepth 1 -type f -name '*.md' ! -name '_*.md' -delete

          cp docs/*.md wiki/

          # Forgejo/Gitea wiki landing page must be Home.md.
          if [ -f wiki/index.md ]; then
            mv wiki/index.md wiki/Home.md
          fi

          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          short=$(echo "${GITHUB_SHA:-unknown}" | cut -c1-7)
          git commit -m "sync docs from main@${short}"
          git push
